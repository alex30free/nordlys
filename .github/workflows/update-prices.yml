name: Update prices

on:
  schedule:
    # 17:15 UTC on weekdays = after the Nordic exchanges close (18:15 Swedish winter time)
    - cron: "15 17 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button so you can run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install yfinance

      - name: Download prices
        run: python scripts/update_prices.py

      - name: Save the new prices
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push
          fi
